<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random</title>
</head>
<body>
  <script>
    const GITHUB_USER = "EyelessHairball";
    const REPO_NAME = "main";
    const BRANCH = "main";
    const IGNORE_FOLDER = "random"; 

    const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/?ref=${BRANCH}`;

    fetch(apiUrl)
      .then(res => res.json())
      .then(items => {
        const folders = items
          .filter(item =>
            item.type === "dir" &&
            item.name !== IGNORE_FOLDER
          )
          .map(item => item.name);

        if (folders.length === 0) {
          document.body.innerText = "No pages found.";
          return;
        }

        const choice = folders[Math.floor(Math.random() * folders.length)];

        window.location.href = `/${choice}/`;
      })
      
      .catch(err => {
        console.error(err);
      });
  </script>
</body>
</html>
