<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper Plus</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: white;
    color: black;
    font-size: 10px;
    
}

#upload-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

#upload-container h2 {
    margin-bottom: 20px;
}

#fileInput {
    background: white;
    color: black;
    border-radius: 2px;
}

canvas {
    display: none;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<div id="upload-container">
    <h2>Upload the .pck and .wasm to start (you can obtain them from <a href="https://drive.google.com/drive/folders/15bxatF-dJCvdndDuux5oU75_FndSfF0S?usp=drive_link">here</a>)</h2>
    <input type="file" id="fileInput" multiple accept=".pck,.wasm">
</div>

<canvas id="canvas"></canvas>
<script src="index.js"></script>
<script>
const fileInput = document.getElementById("fileInput");
const uploadContainer = document.getElementById("upload-container");
const canvas = document.getElementById("canvas");

let uploadedFiles = {};

fileInput.addEventListener("change", async (event) => {
    const files = event.target.files;

    for (let file of files) {
        uploadedFiles[file.name] = file;
    }

    if (uploadedFiles["index.pck"] && uploadedFiles["index.wasm"]) {
        startGame();
    }
});

async function startGame() {
    const pckBlob = uploadedFiles["index.pck"];
    const wasmBlob = uploadedFiles["index.wasm"];

    const pckURL = URL.createObjectURL(pckBlob);
    const wasmURL = URL.createObjectURL(wasmBlob);

    uploadContainer.style.display = "none";
    canvas.style.display = "block";

    const GODOT_CONFIG = {
        args: [],
        canvasResizePolicy: 2,
        executable: "index",
        mainPack: pckURL,
        locateFile: function(path) {
            if (path.endsWith(".wasm")) {
                return wasmURL;
            }
            return path;
        }
    };

    const engine = new Engine(GODOT_CONFIG);

    engine.startGame().catch(err => {
        console.error(err);
        alert("Failed to start game.");
    });
}

</script>

</body>
</html>
