<html>

<head>
  <title>UNDER CONSTRUCTION</title>

  <style>
    @font-face {
      font-family: "VCR";
      src: url("https://raw.githubusercontent.com/EyelessHairball/main/main/assets/fonts/VCR_OSD_MONO_1.001.ttf") format("truetype");
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "VCR", monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("https://github.com/EyelessHairball/images/blob/main/construction/limbo.webp?raw=true") center/cover no-repeat;
      filter: blur(2px);
      transform: scale(1.1);
      z-index: -1;
    }

    .banner {
      position: absolute;
      width: 100%;
      height: 50px;
      overflow: hidden;
    }

    .banner.top {
      top: 0;
    }

    .banner.bottom {
      bottom: 0;
    }

    .track {
      display: flex;
      width: max-content;
      animation: scroll 60s linear infinite;
    }

    .track img {
      height: 50px;
      image-rendering: pixelated;
    }

    @keyframes scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .center-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 40px;
      width: 500px;
      text-align: center;
      border-radius: 0;
      font-size: 24px;
    }

    .center-box img {
      width: 120px;
      margin-bottom: 20px;
      image-rendering: pixelated;
    }

    a {
      color: #87ceeb;
    }
  </style>
</head>

<body>

  <div class="banner top">
    <div class="track">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
    </div>
  </div>

  <div class="center-box">
    <h2>UNDER CONSTRUCTION</h2>
    <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/constructionmantransparent.png">
    <div>
      This page is currently being redesigned, however feel free to check out the other pages, like the
      <a href="https://fatrhabit.org/directory/">directory.</a>
    </div>
  </div>

  <div class="banner bottom">
    <div class="track">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
      <img src="https://raw.githubusercontent.com/EyelessHairball/images/main/construction/underconstruction.png">
    </div>
  </div>

</body>

</html>
