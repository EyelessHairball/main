<html>
<head>
<title>Unix Timestamp Gen</title>
<style>
body {
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}
</style>
</head>
<body>

<div>
  <input type="number" id="year" placeholder="Year"><br><br>
  <input type="number" id="month" placeholder="Month (1-12)"><br><br>
  <input type="number" id="day" placeholder="Day"><br><br>
  <input type="number" id="hour" placeholder="Hour"><br><br>
  <input type="number" id="minute" placeholder="Minute"><br><br>
  <input type="number" id="second" placeholder="Second"><br><br>

  <p>Local: <span id="local"></span></p>
  <p>Global: <span id="global"></span></p>
</div>

<script>
const inputs = document.querySelectorAll("input");

inputs.forEach(input => input.addEventListener("input", calculate));

function calculate() {
  const year = Number(document.getElementById("year").value);
  const month = Number(document.getElementById("month").value) - 1;
  const day = Number(document.getElementById("day").value);
  const hour = Number(document.getElementById("hour").value);
  const minute = Number(document.getElementById("minute").value);
  const second = Number(document.getElementById("second").value);

  if (!year || !day) return;

  const localDate = new Date(year, month, day, hour, minute, second);
  const localTimestamp = Math.floor(localDate.getTime() / 1000);

  const utcTimestamp = Math.floor(Date.UTC(year, month, day, hour, minute, second) / 1000);

  document.getElementById("local").textContent = localTimestamp;
  document.getElementById("global").textContent = utcTimestamp;
}
</script>

</body>
</html>
