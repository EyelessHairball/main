<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>PCM</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <canvas id="oscilloscope"></canvas>

<div class="inputwrap" id="wrap">
  <textarea id="equation">Math.sin(2 * Math.PI * freq * t)</textarea>

  <label>Frequency: <span id="freqValue">440</span> Hz</label>
  <input type="range" id="freqSlider" min="100" max="16000" value="440" class="slider">

  <label>Volume: <span id="volValue">0.1</span></label>
  <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.1" class="slider">

  <label for="waveColor">Wave Color:</label>
  <input type="color" id="waveColor" value="#00ff00">

  <button onclick="TOGGLE_MODE()">Mode: Float</button>
  <button onclick="START_SYNTH()">Apply Equation</button>
  <button id="toggle-button">≡</button>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
